  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a08;
      --bg2: #111110;
      --bg3: #1a1a17;
      --fg: #e8e6df;
      --fg2: #a09e97;
      --fg3: #7a7870;
      --accent: #d4ff4e;
      --accent2: #ff6b35;
      --accent3: #4ecdc4;
      --border: rgba(255, 255, 255, 0.07);
      --nav-bg: rgba(10, 10, 8, 0.75);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    /* ── LIGHT MODE ── */
    html.light {
      --bg: #f5f4ef;
      --bg2: #eceae2;
      --bg3: #e0ddd3;
      --fg: #1a1916;
      --fg2: #4a4740;
      --fg3: #6a6860;
      --accent: #5a8c00;
      --accent2: #d44000;
      --accent3: #007a74;
      --border: rgba(0, 0, 0, 0.09);
      --nav-bg: rgba(245, 244, 239, 0.82);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    /* Smooth theme transitions — only on key properties, not * */
    body {
      transition: background-color 0.35s ease, color 0.35s ease;
    }
    a, button, nav, section, .hero-card, .skill-card, footer, .marquee-wrap,
    .stack-badge, .skill-tag, .social-link, .theme-toggle, .nav-cta,
    .btn-primary, .btn-ghost, .about-accent-box, .about-img-frame,
    .slider-btn, .slider-dot, .hero-bg-text, .about-img-inner {
      transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
    }

    /* Exempt animations from the global transition override */
    .reveal,
    .marquee-track,
    .cursor,
    .cursor-ring,
    .scroll-hint {
      transition: opacity 0.7s ease, transform 0.7s ease, background-color 0.35s, border-color 0.35s, color 0.35s;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      cursor: none;
      overflow-x: hidden;
    }

    /* Custom cursor */
    .cursor {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
      mix-blend-mode: difference;
    }

    .cursor-ring {
      width: 36px;
      height: 36px;
      border: 1.5px solid rgba(212, 255, 78, 0.5);
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
    }

    body:has(a:hover) .cursor,
    body:has(button:hover) .cursor {
      width: 20px;
      height: 20px;
    }

    body:has(a:hover) .cursor-ring,
    body:has(button:hover) .cursor-ring {
      width: 60px;
      height: 60px;
      border-color: var(--accent);
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }

    /* NAV */
    /* Skip-to-content link for accessibility */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 1rem;
      background: var(--accent);
      color: var(--bg);
      padding: 0.5rem 1rem;
      z-index: 200;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-decoration: none;
    }
    .skip-link:focus {
      top: 0.5rem;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      background: var(--nav-bg);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      color: var(--fg);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--fg2);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.3s;
    }

    .nav-links a:hover {
      color: var(--fg);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.5rem 1.2rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.25s;
    }

    .nav-cta:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 8rem 3rem 4rem;
      position: relative;
      overflow: hidden;
      contain: layout style;
    }

    .hero-left {
      min-height: 350px;
    }

    .hero-bg-text {
      position: absolute;
      bottom: -2rem;
      right: -1rem;
      font-family: var(--font-display);
      font-size: clamp(8rem, 18vw, 22rem);
      color: transparent;
      -webkit-text-stroke: 1px rgba(144, 238, 144, 0.35);
      pointer-events: none;
      user-select: none;
      line-height: 1;
      letter-spacing: -0.02em;
      animation: dev-flicker 5s ease-out forwards;
    }

    @keyframes dev-flicker {
      0%   { opacity: 0; }
      2%   { opacity: 0.15; }
      4%   { opacity: 0.85; }
      5%   { opacity: 0.08; }
      7%   { opacity: 0.75; }
      8%   { opacity: 0.1; }
      10%  { opacity: 0.9; }
      11%  { opacity: 0.15; }
      13%  { opacity: 1; }
      14%  { opacity: 0.2; }
      16%  { opacity: 1; }
      18%  { opacity: 0.25; }
      20%  { opacity: 1; }
      23%  { opacity: 0.4; }
      26%  { opacity: 1; }
      30%  { opacity: 0.45; }
      34%  { opacity: 1; }
      40%  { opacity: 0.5; }
      45%  { opacity: 1; }
      55%  { opacity: 0.55; }
      62%  { opacity: 1; }
      75%  { opacity: 0.5; }
      82%  { opacity: 1; }
      100% { opacity: 1; }
    }

    .hero-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-tag::before {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--accent);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(4rem, 8vw, 9rem);
      line-height: 0.92;
      letter-spacing: -0.01em;
      margin-bottom: 2rem;
    }

    .hero h1 .line-2 {
      color: transparent;
      -webkit-text-stroke: 1.5px var(--fg);
    }

    .hero h1 .line-3 {
      color: var(--accent);
    }

    .hero-desc {
      font-size: 1.05rem;
      color: var(--fg2);
      max-width: 420px;
      line-height: 1.75;
      margin-bottom: 2.5rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn-primary {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 0.9rem 2rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      transition: all 0.25s;
      display: inline-block;
    }

    .btn-primary:hover {
      background: #c4ef3e;
      transform: translateY(-2px);
    }

    .btn-ghost {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 0.9rem 2rem;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.25s;
      display: inline-block;
    }

    .btn-ghost:hover {
      border-color: var(--fg2);
      transform: translateY(-2px);
    }

    .hero-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .hero-card {
      width: 320px;
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 2rem;
      right: 2rem;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
    }

    .hero-card-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--fg2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    

    .stat-num {
      font-family: var(--font-display);
      font-size: 3rem;
      line-height: 1;
      color: var(--fg);
    }

    .stat-num span {
      color: var(--accent);
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--fg3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .hero-divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    .hero-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .stack-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 0.25rem 0.6rem;
      background: var(--bg3);
      color: var(--fg2);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    }

    .stack-badge:hover {
      background: var(--accent);
      color: var(--bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(212, 255, 78, 0.3);
    }

    .stack-badge:active {
      transform: scale(0.9);
      transition: transform 0.1s;
    }

    .stack-badge.accent {
      background: rgba(212, 255, 78, 0.1);
      color: var(--accent);
    }

    .stack-badge.accent:hover {
      background: var(--accent2);
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.4);
    }

    /* Scroll indicator */
    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--fg3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: float 2.5s ease-in-out infinite;
    }

    .scroll-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(var(--accent), transparent);
    }

    @keyframes float {

      0%,
      100% {
        transform: translateX(-50%) translateY(0)
      }

      50% {
        transform: translateX(-50%) translateY(8px)
      }
    }

    /* SECTION COMMONS */
    section {
      padding: 7rem 3rem;
    }

    /* Off-screen sections: skip rendering work for below-fold content */
    .about,
    #skills,
    .contact {
      content-visibility: auto;
      contain-intrinsic-size: auto 600px;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::before {
      content: '';
      width: 30px;
      height: 1px;
      background: var(--accent);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 5vw, 5rem);
      line-height: 0.95;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
    }

    .section-sub {
      font-size: 1rem;
      color: var(--fg2);
      max-width: 520px;
      line-height: 1.7;
    }

    /* ABOUT */
    .about {
      background: var(--bg2);
    }

    .about-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2rem;
      align-items: start;
      margin-top: 4rem;
      transition: grid-template-columns 0.45s ease, gap 0.45s ease;
    }

    .about-grid:has(.about-image-wrap.gallery-visible) {
      grid-template-columns: 1fr 1.2fr;
      gap: 5rem;
    }

    .about-image-wrap {
      position: relative;
      overflow: visible;
      min-width: 0;
      transition: width 0.45s ease;
    }

    .about-img-frame {
      width: 100%;
      aspect-ratio: 4/5;
      background: var(--bg3);
      position: relative;
      overflow: hidden;
    }

    .about-img-frame::after {
      content: var(--about-avatar, '');
      font-family: var(--font-display);
      font-size: 12rem;
      color: rgba(212, 255, 78, 0.06);
      position: absolute;
      bottom: -1rem;
      right: -1rem;
    }

    .about-img-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a2a1a 0%, #0d1a1a 50%, #1a1010 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Image Slider ── */
    .about-slider {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .about-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      background: var(--bg2);
    }

    .about-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .about-slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Prompt Overlay ── */
    .prompt-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 6;
      max-height: 50%;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .about-slide.active:hover .prompt-overlay,
    .about-slide.active.prompt-visible .prompt-overlay {
      transform: translateY(0);
    }

    .prompt-overlay-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 8, 0.92), rgba(10, 10, 8, 0.7) 60%, rgba(10, 10, 8, 0));
      pointer-events: none;
    }

    html.light .prompt-overlay-bg {
      background: linear-gradient(to top, rgba(26, 25, 22, 0.92), rgba(26, 25, 22, 0.7) 60%, rgba(26, 25, 22, 0));
    }

    .prompt-overlay-content {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 1rem 1.1rem 1.1rem 1.2rem;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      min-height: 0;
    }

    .prompt-text {
      flex: 1;
      margin: 0;
      font-family: var(--font-body);
      font-size: 0.78rem;
      line-height: 1.55;
      color: rgba(232, 230, 223, 0.92);
      user-select: text;
      cursor: text;
      word-break: break-word;
    }

    /* Subtle scrollbar for prompt text */
    .prompt-overlay-content::-webkit-scrollbar {
      width: 4px;
    }

    .prompt-overlay-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .prompt-overlay-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 2px;
    }

    .prompt-overlay-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    html.light .prompt-overlay-content::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
    }

    html.light .prompt-overlay-content::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }

    html.light .prompt-text {
      color: rgba(245, 244, 239, 0.95);
    }

    .prompt-copy-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(232, 230, 223, 0.85);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      position: relative;
      transition: all 0.25s;
      backdrop-filter: blur(4px);
      padding: 0;
      line-height: 1;
    }

    .prompt-copy-btn:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    html.light .prompt-copy-btn {
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(245, 244, 239, 0.9);
    }

    html.light .prompt-copy-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .copy-feedback {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 0.62rem;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 10;
    }

    .prompt-copy-btn.copied .copy-feedback {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Prompt indicator (subtle icon showing prompt is available) */
    .prompt-indicator {
      position: absolute;
      top: -28px;
      right: 8px;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: rgba(232, 230, 223, 0.55);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .about-slide.active:hover .prompt-indicator,
    .about-slide.active.prompt-visible .prompt-indicator {
      opacity: 0;
    }

    html.light .prompt-indicator {
      color: rgba(26, 25, 22, 0.55);
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 10, 8, 0.6);
      color: var(--fg);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      backdrop-filter: blur(6px);
      transition: all 0.3s;
      padding: 0;
      line-height: 1;
    }

    .slider-btn:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .slider-prev {
      left: 0.75rem;
    }

    .slider-next {
      right: 0.75rem;
    }

    .slider-dots {
      position: absolute;
      bottom: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 5;
    }

    .slider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s;
    }

    .slider-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }

    /* Light mode slider btn */
    html.light .slider-btn {
      background: rgba(245, 244, 239, 0.75);
      border-color: rgba(0, 0, 0, 0.15);
      color: var(--fg);
    }

    html.light .slider-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    html.light .slider-dot {
      background: rgba(0, 0, 0, 0.2);
    }

    html.light .slider-dot.active {
      background: var(--accent);
    }

    .about-avatar {
      font-family: var(--font-display);
      font-size: 5rem;
      color: var(--fg3);
    }

    .about-accent-box {
      position: relative;
      padding: 1rem 1.5rem;
      background: var(--accent);
      color: var(--bg);
      z-index: 7;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s, top 0.45s ease, left 0.45s ease;
    }

    /* When gallery is visible, accent box overlaps top-left of the image */
    .about-image-wrap.gallery-visible .about-accent-box {
      position: absolute;
      top: -1.5rem;
      left: -1.5rem;
    }

    .about-accent-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(212, 255, 78, 0.35);
    }

    .about-accent-box:active {
      transform: scale(0.95);
      transition: transform 0.1s;
    }

    /* ── Photo Gallery Toggle ── */
    .about-img-frame,
    .about-image-wrap .slider-btn,
    .about-image-wrap .slider-dots {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, position 0s 0.45s;
    }

    /* When hidden: collapse gallery elements out of flow so accent box
       is the only thing sizing the auto grid column */
    .about-image-wrap:not(.gallery-visible) .about-img-frame,
    .about-image-wrap:not(.gallery-visible) .slider-btn,
    .about-image-wrap:not(.gallery-visible) .slider-dots {
      position: absolute;
      width: 100%;
    }

    .about-image-wrap:not(.gallery-visible) .about-img-frame {
      height: 100%;
      background: var(--bg3);
    }

    .about-image-wrap:not(.gallery-visible) .about-img-inner {
      background: var(--bg3);
    }

    .about-image-wrap.gallery-visible .about-img-frame,
    .about-image-wrap.gallery-visible .slider-btn,
    .about-image-wrap.gallery-visible .slider-dots {
      opacity: 1;
      pointer-events: auto;
    }

    .about-text {
      transition: max-width 0.45s ease;
    }

    .about-accent-box .num {
      font-family: var(--font-display);
      font-size: 2.4rem;
      line-height: 1;
    }

    .about-accent-box .lbl {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .about-text p {
      color: var(--fg2);
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 1.25rem;
    }

    .about-text p strong {
      color: var(--fg);
      font-weight: 500;
    }

    .about-text p em {
      color: var(--accent);
      font-style: normal;
    }

    .about-timeline {
      margin-top: 2.5rem;
    }

    .timeline-item {
      display: flex;
      gap: 1.5rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--border);
    }

    .timeline-year {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.06em;
      min-width: 60px;
      padding-top: 0.1rem;
    }

    .timeline-info h3 {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .timeline-info p {
      font-size: 0.85rem;
      color: var(--fg2);
    }

    /* SKILLS */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
      margin-top: 4rem;
      background: var(--border);
    }

    .skill-card {
      background: var(--bg);
      padding: 2.5rem 2rem;
      transition: background 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .skill-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .skill-card:hover {
      background: var(--bg2);
      box-shadow: 0 0 0 1px rgba(212, 255, 78, 0.25), 0 0 20px rgba(212, 255, 78, 0.08);
    }

    .skill-card:hover::before {
      opacity: 1;
    }

    .skill-icon {
      font-size: 1.8rem;
      margin-bottom: 1.25rem;
    }

    /* ── AI ROBOT ICON: "Cooking" Animation ── */
    .skill-card.ai-glow .skill-icon {
      display: inline-block;
      animation: ai-cook 3s ease-in-out infinite;
    }

    @keyframes ai-cook {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(8deg) scale(1.08); }
      75%  { transform: rotate(-8deg) scale(1.08); }
    }

    .skill-card h3 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.03em;
      margin-bottom: 0.5rem;
    }

    .skill-card p {
      font-size: 0.88rem;
      color: var(--fg2);
      line-height: 1.65;
      margin-bottom: 1.25rem;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .skill-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--border);
      color: var(--fg3);
      letter-spacing: 0.05em;
    }

    /* CONTACT */
    .contact {
      position: relative;
      overflow: hidden;
    }

    .contact::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 255, 78, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .contact-inner {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .contact-inner .section-label {
      justify-content: center;
    }

    .contact-inner .section-label::before {
      display: none;
    }

    .contact-inner .section-title {
      font-size: clamp(3rem, 7vw, 7rem);
    }

    .contact-sub {
      font-size: 1.05rem;
      color: var(--fg2);
      line-height: 1.7;
      margin: 1.5rem auto 2.5rem;
      max-width: 460px;
    }

    .contact-email {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 3rem;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    .contact-email:hover {
      color: var(--fg);
    }

    .contact-socials {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .social-link {
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg2);
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.25s;
    }

    .social-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-3px);
    }

    /* FOOTER */
    footer {
      padding: 2rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--fg3);
      letter-spacing: 0.06em;
    }

    .footer-back {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--fg3);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }

    .footer-back:hover {
      color: var(--accent);
    }

    /* ANIMATIONS */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay-1 {
      transition-delay: 0.1s;
    }

    .reveal-delay-2 {
      transition-delay: 0.2s;
    }

    .reveal-delay-3 {
      transition-delay: 0.3s;
    }

    /* Marquee */
    .marquee-wrap {
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      background: var(--bg3);
    }

    .marquee-track {
      display: flex;
      gap: 0;
      animation: marquee 25s linear infinite;
      width: max-content;
    }

    .marquee-wrap:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee-item {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: var(--fg3);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-inline: 1.5rem;
    }

    .marquee-item span {
      color: var(--accent);
    }

    @keyframes marquee {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* ── THEME TOGGLE ── */
    .theme-toggle {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--fg2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .theme-toggle .icon-sun,
    .theme-toggle .icon-moon {
      position: absolute;
      transition: opacity 0.3s, transform 0.4s;
    }

    html.light .theme-toggle .icon-moon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    html.light .theme-toggle .icon-sun {
      opacity: 0;
      transform: rotate(90deg) scale(0.5);
    }

    html:not(.light) .theme-toggle .icon-sun {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    html:not(.light) .theme-toggle .icon-moon {
      opacity: 0;
      transform: rotate(-90deg) scale(0.5);
    }

    /* Light mode hero outline text */
    html.light .hero h1 .line-2 {
      -webkit-text-stroke: 1.5px var(--fg);
    }

    html.light .hero-bg-text {
      -webkit-text-stroke: 1px rgba(100, 180, 100, 0.45);
    }

    /* Light mode about inner gradient */
    html.light .about-img-inner {
      background: linear-gradient(135deg, #d0e8d0 0%, #c8dde0 50%, #e0d0d0 100%);
    }

    /* Light mode stack badge accent */
    html.light .stack-badge.accent {
      background: rgba(90, 140, 0, 0.12);
      color: var(--accent);
    }

    /* Light mode nav CTA */
    html.light .nav-cta:hover {
      background: var(--accent);
      color: #fff;
    }

    html.light .btn-primary {
      color: #fff;
    }

    html.light .btn-primary:hover {
      background: #4a7600;
    }

    @media (max-width: 900px) {
      /* Hide custom cursor on touch devices */
      .cursor,
      .cursor-ring {
        display: none;
      }

      body {
        cursor: auto;
      }

      nav {
        padding: 1.25rem 1.5rem;
      }

      .nav-links {
        display: none;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 7rem 1.5rem 4rem;
        gap: 3rem;
      }

      .hero-right {
        justify-content: flex-start;
      }

      .hero-card {
        width: 100%;
        max-width: 360px;
      }

      .about-grid:has(.about-image-wrap.gallery-visible) {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }

      /* Mobile: show prompt hint indicator */
      .prompt-indicator {
        top: auto;
        bottom: 8px;
        left: 8px;
        right: auto;
        font-size: 0.62rem;
        opacity: 0.7;
        background: rgba(10, 10, 8, 0.6);
        padding: 3px 8px;
        border-radius: 4px;
        backdrop-filter: blur(4px);
      }

      html.light .prompt-indicator {
        background: rgba(26, 25, 22, 0.55);
      }

      .about-slide.active.prompt-visible .prompt-indicator {
        opacity: 0;
      }

      /* Mobile: slightly smaller prompt text */
      .prompt-text {
        font-size: 0.73rem;
      }

      .prompt-overlay-content {
        padding: 0.7rem 0.7rem 0.85rem;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      section {
        padding: 5rem 1.5rem;
      }

      footer {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }

/* ═══════════════════════════════════════════
   INTERACTIVE ENHANCEMENTS
   ═══════════════════════════════════════════ */

/* ── Ripple Effect ── */
.ripple-container {
  position: relative;
  overflow: hidden;
}

.ripple-effect {
  position: absolute;
  border-radius: 50%;
  background: rgba(212, 255, 78, 0.35);
  transform: scale(0);
  animation: ripple-anim 0.7s ease-out forwards;
  pointer-events: none;
  z-index: 1;
}

@keyframes ripple-anim {
  to { transform: scale(4); opacity: 0; }
}

/* ── 3D Tilt for Cards ── */
.hero-card {
  transition: transform 0.15s ease-out;
  transform-style: preserve-3d;
  will-change: transform;
}

/* ── Stat Number Pulse ── */
.stat-num.pulse {
  animation: stat-pulse 0.45s cubic-bezier(0.16,1,0.3,1);
}

@keyframes stat-pulse {
  0%   { transform: scale(1); color: var(--fg); }
  50%  { transform: scale(1.18); color: var(--accent); }
  100% { transform: scale(1); color: var(--fg); }
}

/* ── Skill Tag Interactive ── */
.skill-tag {
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  user-select: none;
}

.skill-tag:hover {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(212, 255, 78, 0.25);
}

.skill-tag:active {
  transform: scale(0.9);
  transition: transform 0.1s;
}

/* ── Skill Tag Flip Animation ── */
.skill-tag.flipped {
  background: var(--accent2);
  color: #fff;
  border-color: var(--accent2);
  animation: tag-flip 0.45s ease;
}

@keyframes tag-flip {
  0%   { transform: rotateY(0deg); }
  40%  { transform: rotateY(90deg) scale(1.1); }
  100% { transform: rotateY(0deg) scale(1); }
}

/* ── Timeline Expandable ── */
.timeline-item {
  cursor: pointer;
  transition: background 0.35s, padding-left 0.35s;
  position: relative;
  flex-wrap: wrap;
}

.timeline-item::after {
  content: '▸ Click to expand';
  position: absolute;
  right: 0;
  top: 1.25rem;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--fg3);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.timeline-item:hover::after {
  opacity: 0.7;
}

.timeline-item:hover {
  background: rgba(212, 255, 78, 0.03);
  padding-left: 0.6rem;
}

.timeline-item.expanded {
  background: rgba(212, 255, 78, 0.05);
  padding-left: 0.6rem;
}

.timeline-item.expanded::after {
  content: '▾ Click to collapse';
  opacity: 0.7;
}

.timeline-item .timeline-extra {
  flex-basis: 100%;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s ease, opacity 0.35s, margin 0.35s;
  opacity: 0;
  margin-top: 0;
  max-width: 36rem;
}

.timeline-item.expanded .timeline-extra {
  max-height: 800px;
  overflow-y: auto;
  opacity: 1;
  margin-top: 0.75rem;
}

/* ── Hero BG Text Parallax ── */
.hero-bg-text {
  transition: transform 0.15s cubic-bezier(0.16,1,0.3,1);
  will-change: transform;
}

/* ── Magnetic Button Effect ── */
.nav-cta,
.btn-primary,
.btn-ghost {
  transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), background 0.25s, color 0.25s, border-color 0.25s;
  will-change: transform;
}

/* ── Glow Pulse ── */
.glow-pulse {
  animation: glow-pulse 3s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 4px rgba(212, 255, 78, 0.08); }
  50%      { box-shadow: 0 0 22px rgba(212, 255, 78, 0.3), 0 0 40px rgba(212, 255, 78, 0.08); }
}

/* ── Headline Glitch on Double-click ── */
@keyframes headline-glitch {
  0%   { transform: translate(0); }
  15%  { transform: translate(-4px, 2px); }
  30%  { transform: translate(4px, -2px); }
  45%  { transform: translate(-3px, -3px); }
  60%  { transform: translate(3px, 1px); }
  75%  { transform: translate(-2px, 1px); }
  90%  { transform: translate(1px, -1px); }
  100% { transform: translate(0); }
}

/* ── Copy Toast ── */
.copy-toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 0.7rem 1.6rem;
  border-radius: 4px;
  z-index: 10000;
  opacity: 0;
  transition: opacity 0.35s, transform 0.35s cubic-bezier(0.16,1,0.3,1);
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.copy-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Contact Email Copy Cursor ── */
.contact-email {
  cursor: pointer;
  position: relative;
}

.contact-email::after {
  content: 'Click to copy';
  position: absolute;
  bottom: -1.6rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--fg3);
  opacity: 0;
  transition: opacity 0.35s;
  white-space: nowrap;
  pointer-events: none;
}

.contact-email:hover::after {
  opacity: 1;
}

/* ── Social Link Enhanced Hover ── */
.social-link {
  position: relative;
  overflow: hidden;
}

.social-link::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 0;
}

.social-link:hover::before {
  opacity: 0.12;
}

.social-link i {
  position: relative;
  z-index: 1;
}

/* ── Footer Back Link Enhanced ── */
.footer-back {
  position: relative;
  transition: opacity 0.3s;
}

.footer-back::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--accent);
  transition: width 0.35s;
}

.footer-back:hover::after {
  width: 100%;
}

/* ── Footer Copy Hover ── */
.footer-copy {
  cursor: default;
  transition: color 0.3s;
}

.footer-copy:hover {
  color: var(--accent);
}

/* ── Marquee Drag Cursor ── */
.marquee-track {
  cursor: grab;
  user-select: none;
}

.marquee-track:active {
  cursor: grabbing;
}

/* ── Marquee Item Hover ── */
.marquee-item {
  transition: color 0.3s;
}

.marquee-item:hover {
  color: var(--fg);
}

.marquee-item:hover span {
  color: var(--accent2);
  transition: color 0.3s;
}

/* ── Easter Egg Body Shake ── */
body.easter-egg-active {
  animation: easter-shake 0.5s ease;
}

@keyframes easter-shake {
  0%, 100% { transform: translateX(0); }
  15%  { transform: translateX(-8px) rotate(-1.5deg); }
  30%  { transform: translateX(8px) rotate(1.5deg); }
  45%  { transform: translateX(-5px); }
  60%  { transform: translateX(5px); }
  75%  { transform: translateX(-2px); }
  90%  { transform: translateX(2px); }
}


/* ── Key hint ── */
.nav-logo {
  cursor: pointer;
  position: relative;
}

.nav-logo:active {
  transform: scale(0.9);
  transition: transform 0.15s;
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .ripple-effect,
  .skill-tag.flipped,
  .stat-num.pulse,
  .glow-pulse,
  body.easter-egg-active {
    animation: none !important;
  }
  .marquee-track {
    animation: none !important;
  }
  .skill-card,
  .hero-card {
    transition: none !important;
  }
}

  <script>
    // ── THEME TOGGLE ──
    const html = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');

    // Respect system preference on first load
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'light' || (!saved && !prefersDark)) html.classList.add('light');

    toggleBtn.addEventListener('click', () => {
      html.classList.toggle('light');
      localStorage.setItem('theme', html.classList.contains('light') ? 'light' : 'dark');
    });

    // Custom cursor
    const cursor = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursorRing');
    let cx = 0, cy = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });
    function animateCursor() {
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
      rx += (cx - rx) * 0.12;
      ry += (cy - ry) * 0.12;
      cursorRing.style.left = rx + 'px';
      cursorRing.style.top = ry + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Scroll reveal
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); }
      });
    }, { threshold: 0.1 });
    reveals.forEach(el => observer.observe(el));

    // Nav active highlight
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-links a');
    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(s => {
        if (window.scrollY >= s.offsetTop - 120) current = s.id;
      });
      navLinks.forEach(a => {
        a.style.color = a.getAttribute('href') === '#' + current ? 'var(--fg)' : '';
      });
    });
  </script>
